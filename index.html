<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Todo</h1>

      <form id="todo-form" class="todo-form">
        <input
          id="todo-input"
          type="text"
          placeholder="What needs to be done?"
          autocomplete="off"
          required
        />
        <button type="submit">Add</button>
      </form>

      <ul id="todo-list" class="todo-list"></ul>

      <p id="empty-message" class="empty-message" hidden>Nothing to do. Nice.</p>

      <footer class="todo-footer">
        <span id="todo-count">0 items left</span>
        <button id="clear-completed" type="button" class="link-button" hidden>
          Clear completed
        </button>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
